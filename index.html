<!doctype html>
<html lang="zh-Hant" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ead6" />
    <script>
      /* 先套用已選色系，避免閃爍 */
      try {
        var t = localStorage.getItem("wy-theme");
        document.documentElement.dataset.theme = /^(paper|celadon|ink|indigo)$/.test(t) ? t : "paper";
      } catch (e) {
        document.documentElement.dataset.theme = "paper";
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="書靈" />
    <link rel="preconnect" href="https://mx.bdfz.net" crossorigin />
    <link rel="stylesheet" href="https://mx.bdfz.net/fonts/huwen/v1/HuWenMingChao.4eeeeaf657.css" crossorigin />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="書靈：收服中外文學與文化裡的書靈——詩人、作品、意象與諾貝爾星河。每日試煉全站同題，旅程關卡、段位、排行榜與圖鑑；每條事實都有登記來源。" />
    <link rel="icon" href="/assets/art/v1/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/assets/art/v1/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/art/v1/icon-180.png" />
    <link rel="preload" as="image" href="/assets/art/v1/logo.webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>書靈</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 身分 SDK／瀏覽計數照常載入；浮動導航 logo 以 CSS 隱藏（站長 2026-10-28：太遮擋） -->
    <script src="https://my.bdfz.net/site-auth.js" defer data-position="left"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
