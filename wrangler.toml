# 書靈 Worker 本機開發設定。尚未註冊發布目標：沒有 route、沒有 workers.dev、D1 編號是佔位值，
# 誤跑 wrangler deploy 會失敗（fail closed）。公開上線前依 platform/release-authority.json 登記後再改。
name = "shuling"
main = "worker/index.ts"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[vars]
SITE_KEY = "shuling"
SITE_TITLE = "書靈"
PRIMARY_HOST = "shuling.bdfz.net"
USER_CENTER_ORIGIN = "https://my.bdfz.net"

[[d1_databases]]
binding = "DB"
database_name = "shuling-db-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
